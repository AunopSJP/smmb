# ใส่ใน server { } ของโดเมน (HTTPS) — ปรับ root ให้ตรงที่คัดลอกเว็บไป
# เว็บ: /smmb/  ·  API: /smmb-api/ (ห้าม rewrite/ตัด path — ตู้เซ็นลายเซ็นจาก path เต็ม และ backend ตั้ง API_PATH_PREFIX=/smmb-api ไว้แล้ว)
#
# ⚠️ add_header ไม่สะสมข้ามชั้น: location ที่มี add_header ของตัวเองจะทิ้งของ server ทั้งหมด
#    (เช่น location = /smmb/index.html ที่ใส่ Cache-Control → header ความปลอดภัยหาย)
#    → คัดลอกชุด header ความปลอดภัยลงทุก location ที่ประกาศ add_header เอง (ทำไว้ให้แล้วด้านล่าง)
#    ถ้าเพิ่ม location ใหม่ ให้คัดลอกตามด้วย · ตรวจซ้ำ: curl -sI https://<โดเมน>/smmb/index.html | findstr /C:"Content-Security-Policy" /C:"X-Content-Type-Options"

# ---------- CSP (Report-Only ก่อน แล้วค่อยบังคับใช้) ----------
# production hub.sjp-dev.net (10 พ.ย. 2026): เปิด **บังคับใช้** แล้ว (Content-Security-Policy + HSTS 1 วัน) หลังเดิน 5 flow ไม่พบ violation
# ค่าในไฟล์นี้คงเป็น Report-Only สำหรับเครื่องใหม่ · ค่า policy ต้องเหมือนกันทุกที่
# ค่าเริ่มต้นนี้อนุญาต: Angular bundle ของตัวเอง · inline style ที่ Angular/Leaflet ใส่ · Google Fonts · แผนที่ OSM · blob worker · รูป base64
# ทดสอบ 5 flow หลัก (เจ้าของ/เจ้าหน้าที่/หัวหน้า/แอดมิน/PWA offline) แล้วดู violation ใน console
#   เมื่อไม่มี violation → เปลี่ยนชื่อ header จาก Content-Security-Policy-Report-Only เป็น Content-Security-Policy
# ห้ามใส่ 'unsafe-eval' · ถ้าแก้ policy ต้องแก้ทั้งสองที่ (location /smmb/ และ location = /smmb/index.html)
# ⚠️ ต้องอนุญาต inline script ของ Angular (beasties) ที่สลับ <link media="print"> เป็น all
#    ถ้าไม่อนุญาต → global CSS ไม่โหลด (การ์ด/ปุ่มไม่มีสไตล์) · hash ด้านล่างมาจาก index.html ของ build
#    อัปเกรด Angular แล้ว hash เปลี่ยน: คำนวณ sha256 (base64) ของเนื้อใน <script>…</script> แล้วแก้ทั้งสองที่
# (เขียนเป็นสตริงตรง ๆ เพราะไฟล์นี้ถูกคัดลอกเข้า server { } — map ใช้ใน server ไม่ได้)

location /smmb-api/ {
    proxy_pass http://127.0.0.1:3000;   # ไม่มี / ท้าย และไม่มี path = ส่ง path เต็มไปตามเดิม
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;                # long-poll ของตู้
    proxy_read_timeout 75s;             # ตู้ถือ 50 วิ · ค่าเริ่มต้น 60 วิ เฉียดเกินไป
    proxy_send_timeout 75s;
    client_max_body_size 32k;
}

# ต้องมี exact ของ path ที่ไม่มี / ท้าย ไม่งั้น nginx ตอบ 301 ให้ GET รายการเฟิร์มแวร์ (location ที่ลงท้าย / + proxy_pass)
location = /smmb-api/api/v1/admin/firmware {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# อัปโหลดเฟิร์มแวร์ตู้ (แอดมิน) — ไฟล์ ~1.2 MB เกินเพดาน 32k ของ /smmb-api/ → 413 · backend จำกัดเองที่ 1.9 MB
# prefix ที่ยาวกว่าชนะ /smmb-api/ จึงใช้เฉพาะเส้นนี้ · ห้ามตัด path เช่นเดียวกัน
location /smmb-api/api/v1/admin/firmware/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 2m;
}

# ⚠️ ห้ามเขียน location แบบ prefix ลงท้าย / ใต้ /smmb-api/v1/box/ (เช่น /smmb-api/v1/box/jobs/) พร้อม proxy_pass —
# nginx จะตอบ 301 ให้ GET /v1/box/jobs (ไม่มี / ท้าย) ไปที่ http://<host>:8080/…/jobs/ → ตู้ถือ long-poll ไม่ได้ ขึ้น offline
# ใช้ regex (~) หรือ exact (=) เท่านั้น · ตรวจ: curl -s -o /dev/null -w "%{http_code}" "https://<โดเมน>/smmb-api/v1/box/jobs?wait=1" ต้องได้ 401
# รูปจากกล้องตู้: Snapface หลังตรวจผ่าน + ภาพสดตอนทดสอบ (JPEG base64 ใน JSON ≤ 120 KB) — เกินเพดาน 32k ของ /smmb-api/
location ~ ^/smmb-api/v1/box/(preview|jobs/[^/]+/photo)$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 128k;
}

location /smmb/ {
    alias /var/www/smmb/;               # เนื้อหาของ frontend/dist/smmb-web/browser/ (npm run build:hub)
    try_files $uri $uri/ /smmb/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    # ยังไม่บังคับใช้ — ดู violation ก่อนแล้วค่อยเปลี่ยนชื่อเป็น Content-Security-Policy
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' blob:; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://cloudflareinsights.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}
# service worker + config ต้องไม่ถูกแคชค้าง — และต้องมี header ความปลอดภัยซ้ำ (ดูหมายเหตุด้านบน)
location = /smmb/ngsw.json        { alias /var/www/smmb/ngsw.json;        add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
location = /smmb/ngsw-worker.js   { alias /var/www/smmb/ngsw-worker.js;   add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
location = /smmb/config.json      { alias /var/www/smmb/config.json;      add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
location = /smmb/index.html       {
    alias /var/www/smmb/index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' blob:; font-src 'self' data:; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://cloudflareinsights.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}
location = /smmb/manifest.webmanifest { alias /var/www/smmb/manifest.webmanifest; default_type application/manifest+json; add_header X-Content-Type-Options nosniff always; }

# HSTS: เปิดที่ server { } หลังยืนยัน HTTPS ตลอด — และต้องใส่ซ้ำใน **ทุก location ที่ประกาศ add_header เอง**
# (location /smmb/ · location = /smmb/index.html · ngsw/config ถ้าต้องการ) เพราะ add_header ไม่สะสมข้ามชั้น
# production 10 พ.ย. 2026 ใช้ max-age=86400 · ผ่าน 1–2 สัปดาห์ค่อยเพิ่มเป็น "max-age=31536000; includeSubDomains"




