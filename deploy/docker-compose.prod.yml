# ฐานข้อมูลสำหรับเครื่อง server จริง (Ubuntu ไม่มีจอ) — Postgres 17 + Redis 7 เป็น container
# ใช้: cp env.example .env && nano .env   แล้ว   docker compose -f docker-compose.prod.yml up -d
# ทั้งสองฟังเฉพาะ 127.0.0.1 (ไม่เปิดสู่เครือข่าย) — backend รันบนเครื่องเดียวกัน (systemd) ต่อผ่าน localhost
name: smmb
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smmb
      POSTGRES_DB: smmb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน deploy/.env}
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smmb -d smmb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis ใช้นับ rate limit / ล็อกบัญชีเท่านั้น (ล่มแล้วระบบยังทำงาน) — ไม่ต้องเก็บลงดิสก์
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?ตั้ง REDIS_PASSWORD ใน deploy/.env}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  pgdata:
