; เฟิร์มแวร์ตู้ SMMB — ESP32-CAM (AI-Thinker) · คู่มือ: ../docs/HARDWARE_FIRMWARE_GUIDE.md
; build:  pio run          แฟลช: pio run -t upload (ต่อ IO0 ลง GND แล้วกด RST ก่อน)
; ดู log: pio device monitor
; แฟลชผ่าน Wi-Fi (OTA): ตั้งรหัสใน ota.local.ini (ไม่เข้า git) แล้ว pio run -e esp32cam-ota -t upload --upload-port <IP ของตู้>
;   (ครั้งแรกต้องแฟลชผ่านสาย -e esp32cam เพื่อใส่ OTA และตารางพาร์ทิชันแบบ 2 ช่อง)
[platformio]
extra_configs = ota.local.ini

[ota]
pass =

[env:esp32cam]
platform = espressif32@7.0.1
board = esp32cam
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
  -DOTA_PASS=\"${ota.pass}\"
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  alvarowolfx/ESP32QRCodeReader@1.1.0

[env:esp32cam-ota]
extends = env:esp32cam
upload_protocol = espota
upload_flags =
  --auth=${ota.pass}

; ดูกล้องล้วน ๆ (ไม่มี backend/สแกน) — แยกจากเฟิร์มแวร์ตู้ตัวจริง: pio run -e camview -t upload
[env:camview]
platform = espressif32@7.0.1
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
build_src_filter = -<*> +<../camview/main.cpp>
lib_deps =
  alvarowolfx/ESP32QRCodeReader@1.1.0
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1

; ดูกล้องแบบโค้ดของพี่ (esp_http_server) ไว้เทียบกับ camview — pio run -e camsimple -t upload
[env:camsimple]
platform = espressif32@7.0.1
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
build_src_filter = -<*> +<../camsimple/main.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
