; เฟิร์มแวร์ตู้ SMMB — ESP32-CAM (AI-Thinker) · คู่มือ: ../docs/HARDWARE_FIRMWARE_GUIDE.md
; build:  pio run          แฟลช: pio run -t upload (ต่อ IO0 ลง GND แล้วกด RST ก่อน)
; ดู log: pio device monitor
[env:esp32cam]
platform = espressif32@7.0.1
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  alvarowolfx/ESP32QRCodeReader@1.1.0

; ดูกล้องล้วน ๆ (ไม่มี backend/สแกน) — แยกจากเฟิร์มแวร์ตู้ตัวจริง: pio run -e camview -t upload
[env:camview]
platform = espressif32@7.0.1
board = esp32cam
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
build_src_filter = -<*> +<../camview/main.cpp>
lib_deps =
  alvarowolfx/ESP32QRCodeReader@1.1.0
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
