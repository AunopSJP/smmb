<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8" />
  <title>Smart Mailbox</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#9A2F36" />
  <meta name="description" content="Smart Mailbox — ระบบตู้จดหมายอัจฉริยะสำหรับหมู่บ้าน: แจ้งของมาส่ง ตรวจตู้โดยเจ้าหน้าที่ และ SOS ถึงเจ้าหน้าที่ในโซน / Smart mailbox for villages: parcel alerts, officer inspections, and zone SOS." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Smart Mailbox" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48x48.png" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- ตั้งธีม/ขนาด/ภาษาก่อน CSS+Angular — กันจอวาบขาว (ไฟล์ public ไม่ต้องใช้ CSP hash) -->
  <script src="theme-boot.js"></script>
  <!-- ฟอนต์ self-host (public/fonts) — ไม่พึ่ง Google: ไม่มี 504, ไม่ส่ง IP ออกนอก, CSP ไม่ต้องเปิด origin ภายนอก
       ใช้ variable font ไฟล์เดียวต่อ family · path เป็น relative กับ <base href> จึงใช้ได้ทั้ง dev (/) และ prod (/smmb/) -->
  <style>
    @font-face {
      font-family: 'Noto Sans Thai';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/NotoSansThai-thai.woff2') format('woff2');
      unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
    }
    @font-face {
      font-family: 'Noto Sans Thai';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('fonts/NotoSansThai-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('fonts/JetBrainsMono-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <noscript>กรุณาเปิด JavaScript เพื่อใช้งาน / Please enable JavaScript to continue.</noscript>
</body>

</html>
